name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B compile

      - name: Tests + couverture
        run: mvn -B test jacoco:report

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
      
      - name: Package (jar) — seulement si tests et couverture OK
        run: mvn -B package -Dexec.skip=true

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-cli-jar
          path: target/task-manager-cli.jar
